services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: risk_gateway
      MYSQL_USER: risk
      MYSQL_PASSWORD: risk_local_only
      MYSQL_ROOT_PASSWORD: root_local_only
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
volumes:
  mysql-data:
  redis-data:
